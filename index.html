      <!-- يوحّد لون شريط الحالة/الأطراف مع رأس الصفحة الأبيض بدل بيج الخلفية العامة -->
      <meta name="theme-color" content="#ffffff" />
      <link rel="icon" type="image/png" href="/favicon.png" />
      <link rel="apple-touch-icon" href="/favicon.png" />
      <!-- الخطّ يُطلب قبل تنفيذ حزمة JS: تعريفه في fonts.css داخل الحزمة،
           فبلا هذا السطر لا يبدأ تحميله إلا بعد تحليل الحزمة كلها ويُرسم
           أول نصّ بخطّ النظام ثم يقفز. -->
      <link rel="preload" href="/DGShamael-Regular.ttf" as="font" type="font/ttf" crossorigin />
      <title>تساهيل العمرة</title>
      <meta name="description" content="تساهيل العمرة — احجز عمرتك بسهولة وطمأنينة." />
      <style>
        html, body { height: 100%; margin: 0; }
        #root { height: 100%; }
        /* أبيض صريح: الشاشة الأولى لا تمرّ بأي CSS من الحزمة */
        body { background: #FFFFFF; }

        /* ── شاشة البدء ──
           مُدرَجة نصياً لا عبر <img>: تُرسم مع أول تحليل للصفحة بلا طلب شبكة،
           وهذا هو بيت القصيد — الفراغ الأبيض يحدث قبل تنفيذ حزمة JS، فلو كانت
           الشاشة مكوّن React لما ظهرت في اللحظة التي تعالجها أصلاً.
           كل المحدّدات مُقيَّدة بـ#tsh-splash: محدِّد `path` عارٍ كان سيصيب كل
           أيقونة lucide في التطبيق.

           هذه هي شاشة التحميل الوحيدة في التطبيق. لا تُزال عند تركيب React
           بل عند جهوز بيانات الصفحة — انظر src/lib/bootSplash.ts — حتى لا
           تظهر شاشة انتظار ثانية بعدها، وتُزال فور الجهوز بلا حدّ أدنى.

           لذلك الدورة قصيرة (1.4s): الصفحة تجهز عند ~380 مللي ثانية، فكلما
           طالت الدورة قلّ ما يُرى من الرسم قبل التلاشي.

           المصدر: img/tasaheel-logo-animated.svg (النسخة هنا مقصوصة على حدّ
           الرسم ومُسرَّعة إلى 1.4s). */
        #tsh-splash {
          position: fixed; inset: 0; z-index: 9999;
          display: flex; align-items: center; justify-content: center;
          background: #FFFFFF;
          transition: opacity .25s ease;
        }
        #tsh-splash.tsh-out { opacity: 0; pointer-events: none; }
        #tsh-splash svg { width: min(58vw, 240px); height: auto; }

        #tsh-splash path {
          fill: transparent;
          stroke: #111;
          /* الـ<g> فيه scale(0.1) فالسماكة تُقسَم على عشرة — 45 هنا = 4.5 وحدة
             داخل viewBox عرضه 289. القيمة الأصلية 18 كانت أقل من نصف بكسل. */
          stroke-width: 45;
          stroke-linecap: round;
          stroke-linejoin: round;
          stroke-dasharray: 1;
          stroke-dashoffset: 1;
          animation: tsh-logo-cycle 1.4s ease-in-out infinite;
        }
        #tsh-splash path:nth-child(2) { animation-delay: .03s; }
        #tsh-splash path:nth-child(3) { animation-delay: .06s; }
        #tsh-splash path:nth-child(4) { animation-delay: .09s; }
        #tsh-splash path:nth-child(5) { animation-delay: .12s; }
        #tsh-splash path:nth-child(6) { animation-delay: .15s; }

        @keyframes tsh-logo-cycle {
          0%   { fill: transparent; stroke-dashoffset: 1; opacity: 0; }
          8%   { opacity: 1; }
          55%  { fill: transparent; stroke-dashoffset: 0; opacity: 1; }
          68%  { fill: #111;        stroke-dashoffset: 0; opacity: 1; }
          88%  { fill: #111;        stroke-dashoffset: 0; opacity: 1; }
          100% { fill: #111;        stroke-dashoffset: 0; opacity: 0; }
        }

        @media (prefers-reduced-motion: reduce) {
          #tsh-splash path { animation: none; fill: #111; stroke-dashoffset: 0; }
        }
      </style>
